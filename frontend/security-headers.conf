# =============================================================================
#  Security headers, included by every location that sets its own add_header.
#
#  Why a snippet: nginx `add_header` inheritance is all-or-nothing. A location
#  that declares ANY add_header loses ALL server-level add_header lines. Keeping
#  them in one file and `include`-ing it avoids silently dropping them.
# =============================================================================
add_header X-Content-Type-Options nosniff                                 always;
add_header X-Frame-Options        DENY                                    always;
add_header Referrer-Policy        strict-origin-when-cross-origin         always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
