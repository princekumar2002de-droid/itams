# =============================================================================
#  ITAMS SPA + reverse proxy in one server block.
#  - Serves the Vite build under /
#  - Proxies /api /actuator /v3/api-docs /swagger-ui.html → backend:8080
#  - Falls back to index.html for client-side routes (react-router).
# =============================================================================

server {
    listen       80;
    server_name  _;

    # Point at the built SPA.
    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # Server level: applies to every location that does NOT set its own
    # add_header (the proxied /api, /actuator, Swagger locations). Locations
    # that do set headers re-include the snippet — see security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Reverse proxy to the backend ────────────────────────────────────────
    # "backend" is the compose service name; docker's embedded DNS resolves it.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /actuator/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
    }
    location /v3/api-docs {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
    }
    location /v3/api-docs/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
    }
    location = /swagger-ui.html {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
    }
    location /swagger-ui/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
    }

    # ── Static assets with hashed filenames — long-lived cache ──────────────
    location /assets/ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;   # else lost: see snippet header
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ── Everything else → SPA (react-router deep links) ─────────────────────
    # CSP is enforced per HTML document, so it only needs to be on the SPA
    # document responses. Tokens live in localStorage, so CSP is the main
    # defence-in-depth against XSS: no inline scripts, no third-party origins.
    # Swagger UI (proxied above) is deliberately NOT covered — it is a dev aid,
    # and prod should disable it (see application-prod.yml).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;
}
