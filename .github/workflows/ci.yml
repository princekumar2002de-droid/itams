# =============================================================================
#  ITAMS CI
#
#  backend   mvn verify: unit tests (surefire) + Testcontainers integration
#            tests (failsafe) against a real PostgreSQL 16 in Docker
#  frontend  typecheck + Vitest + production build + npm audit gate (high+)
#  images    builds both Dockerfiles (no push) so a broken Dockerfile fails CI
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit + integration tests
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (runtime deps, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t itams-backend:ci backend
      - name: Build frontend image
        run: docker build -t itams-frontend:ci frontend
