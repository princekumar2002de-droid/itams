# Publishes the browser-only demo of the frontend to GitHub Pages.
# The demo build answers API calls inside the browser (src/demo/), so no
# server or database is needed. The real deployment is the Docker Compose stack.
name: Demo

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      # GitHub Pages has no SPA fallback: serve index.html for unknown paths
      # so that links like /itams/assets/1 work.
      - run: cp dist-demo/index.html dist-demo/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
